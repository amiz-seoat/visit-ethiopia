# Render Blueprint — Visit Ethiopia (production)
#
# Architecture: Vercel (frontend) → Render web service (Express API) → Neon PostgreSQL (Prisma)
# MongoDB is NOT used in production (DATABASE_MODE=prisma, SKIP_MONGO=true).
#
# Secrets are never stored here. Values marked `sync: false` are entered in the
# Render dashboard (Environment tab). See docs/ENVIRONMENT_VARIABLES.md.
#
# Build applies Prisma migrations with `prisma migrate deploy` (non-destructive,
# only applies committed migrations). Never run `migrate reset` against production.

services:
  - type: web
    name: visit-ethiopia-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_MODE
        value: prisma
      - key: CATALOG_DB
        value: prisma
      - key: SKIP_MONGO
        value: 'true'
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_COOKIE_EXPIRES_IN
        value: '7'
      - key: RECONCILIATION_INTERVAL_MINUTES
        value: '5'
      # Public HTTPS origin of this API (Chapa callback_url, email links)
      - key: PUBLIC_BACKEND_URL
        fromService:
          name: visit-ethiopia-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BACKEND_URL
        fromService:
          name: visit-ethiopia-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      # --- Set in the Render dashboard (never commit) ---------------------
      # Neon pooled URL (…-pooler…?sslmode=require&pgbouncer=true)
      - key: DATABASE_URL
        sync: false
      # Neon direct URL (no -pooler) — used by prisma migrate
      - key: DIRECT_URL
        sync: false
      # Primary frontend origin (Vercel) — CORS + payment return URL
      - key: FRONTEND_URL
        value: https://visit-ethiopia-rw9b.vercel.app
      # Secondary frontend (Render static site)
      - key: CORS_ALLOWED_ORIGINS
        value: https://visit-ethiopia-web.onrender.com
      # Payments: Chapa is used automatically once CHAPA_SECRET_KEY is set.
      # Until then the API runs labelled demo payments (no real money).
      - key: ALLOW_MOCK_PAYMENTS
        value: 'true'
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      # Transactional email (Gmail app password or SMTP)
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  # Secondary static frontend (the primary frontend is on Vercel).
  - type: web
    name: visit-ethiopia-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: visit-ethiopia-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
