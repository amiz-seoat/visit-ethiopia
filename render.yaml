# Render Blueprint — Visit Ethiopia (Phase 1–4I)
# Secrets are NOT stored here. Configure them in the Render dashboard.
# Payment remains MOCK. Phase 4J / Chapa is not part of this deployment.
#
# Notes:
# - Backend is a Node web service. `plan: free` is set explicitly so Blueprint
#   does not default to a paid starter instance.
# - Frontend is a static site (`runtime: static`). Static sites have no compute
#   plan field; including `plan: free` causes Blueprint validation errors.
# - Public service URLs are wired with fromService → RENDER_EXTERNAL_URL
#   (not private-network host). Browser + CORS need the public HTTPS origins.
# - JWT_SECRET / MOCK_WEBHOOK_SECRET use generateValue (Render-generated secrets).

services:
  - type: web
    name: visit-ethiopia-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 90d
      - key: JWT_COOKIE_EXPIRES_IN
        value: '90'
      # Auto-wired public HTTPS origin of this API (email verification links, etc.)
      - key: BACKEND_URL
        fromService:
          name: visit-ethiopia-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PROD_BACKEND_URL
        fromService:
          name: visit-ethiopia-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Auto-wired public HTTPS origin of the static frontend (CORS allowlist)
      - key: FRONTEND_URL
        fromService:
          name: visit-ethiopia-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      # Manual secrets / account credentials (enter in Render; never commit)
      - key: DATABASE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: visit-ethiopia-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Public API origin; frontend appends /api/v1 if missing (see api.ts).
      - key: VITE_API_BASE_URL
        fromService:
          name: visit-ethiopia-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
